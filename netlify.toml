[build]
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer", "stripe"]

[[headers]]
  for = "/*"
  [headers.values]
    # Stops your site being embedded in iframes on other sites (clickjacking)
    X-Frame-Options = "DENY"
    # Stops browsers guessing content types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"
    # Forces HTTPS for 1 year, includes subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Controls what info is sent in the referrer header
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restricts access to browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    # Content Security Policy — allows fonts, Stripe, your own assets
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://api.anthropic.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none';"
